  <text x="600" y="340" text-anchor="middle" fill="#93c5fd" font-size="12">discovery → strategy → execution</text>
  <rect x="780" y="240" width="320" height="140" rx="14" fill="rgba(16,185,129,.2)" stroke="#10b981" stroke-width="1"/>
